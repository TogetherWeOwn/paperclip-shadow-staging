name: pr-lint

# PR-title conventional-commit lint; `pr-lint` is a required check on main.
# Conventions mirror TogetherWeOwn/two-web-next (pr-gates.yml):
#   type(scope): summary, <= 100 chars, no trailing period.
#   Types: feat fix perf refactor test docs build ci chore revert style security.
# No tracker IDs (TOG-*) are required — this is a public repo.
# Keep the JOB name `pr-lint`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Merge queue validation: `pr-lint` is a required check, so it
  # must report on merge_group. The queue run has no PR title and no
  # commits array, so it takes the explicit merge_group branch in the run
  # step and passes vacuously (the title was already linted on the PR).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title convention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_COMMITS: ${{ toJSON(github.event.commits) }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Merge queue validation runs carry no PR title and no commits
          # array (EVENT_COMMITS is null). The title was already linted on
          # the PR head, so pass vacuously here — an explicit branch, so a
          # null payload can never fall through to the commit-subject path.
          if [ "${EVENT_NAME:-}" = "merge_group" ]; then
            echo "pr-lint: merge_group vacuous pass (title linted on PR head)"
            exit 0
          fi
          if [ -n "${INPUT_PR:-}" ]; then
            title="$(gh api "repos/$REPO/pulls/$INPUT_PR" --jq '.title')"
          elif [ -n "${EVENT_TITLE:-}" ]; then
            title="$EVENT_TITLE"
          else
            # Push to main: every commit subject must be conventional
            # (squash-merge keeps main to one conventional commit per PR).
            fail=0
            while IFS= read -r subject; do
              [ -z "$subject" ] && continue
              if ! printf '%s' "$subject" | python3 -c '
          import re, sys
          t = sys.stdin.read()
          sys.exit(0 if re.match(r"^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert|style|security)(\(.+\))?: .*[^.]$", t) and len(t) <= 100 else 1)
          '; then
                echo "::error::Non-conventional commit subject on main: $subject"
                fail=1
              fi
            done <<< "$(printf '%s' "$EVENT_COMMITS" | python3 -c 'import json,sys; print("\n".join(c["message"].split("\n")[0] for c in (json.loads(sys.stdin.read() or "[]") or [])))')"
            [ "$fail" = 0 ] && echo "pr-lint: all main-push subjects conventional"
            exit "$fail"
          fi
          echo "PR title: $title"
          if printf '%s' "$title" | python3 -c '
          import re, sys
          t = sys.stdin.read()
          ok = bool(re.match(r"^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert|style|security)(\(.+\))?: .*[^.]$", t)) and len(t) <= 100
          sys.exit(0 if ok else 1)
          '; then
            echo "pr-lint: title OK"
          else
            echo "::error::PR title must be 'type(scope): summary' (types: feat fix perf refactor test docs build ci chore revert style security), <=100 chars, no trailing period."
            exit 1
          fi
