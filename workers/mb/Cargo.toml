[package]
name = "nntune-mb"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 MusicBrainz mirror read API (Cloudflare Worker, Rust workers-rs)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.3", features = ["http", "tokio-postgres"] }
# Hyperdrive Postgres client: `connect_raw` over the Worker socket with
# the generated connection string (workers-rs `tokio-postgres` example).
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
