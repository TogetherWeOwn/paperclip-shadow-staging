# Dependabot version-updates config.
#
# Alerts are not updates: Dependabot alerts only notify, they never open a
# fix on their own. This file makes Dependabot open version-update PRs so
# vulnerable Actions pins and dependencies actually get fixed.
#
# Pinned-checkout-SHA discipline stays: keep `uses: <action>@<full SHA>`
# with a `# vX.Y.Z` version comment. Dependabot updates the SHA and the
# comment together -- never replace a SHA pin with a bare tag.
#
# One entry per manifest directory: Dependabot takes no globs, and each
# ecosystem looks only in its configured directory. The root workspace
# (`Cargo.toml`, members: `crates/nntune-core`) does NOT cover
# `workers/api`, `workers/ingest` or `workers/mb` (excluded standalone
# crates), so they get their own cargo entries. The batch import image
# (`containers/mb-import/Dockerfile`, FROM postgres) gets its own docker
# entry. npm watches the SvelteKit app (`apps/web`) and the e2e harness
# (`e2e`), not a top-level `web/`.
#
# Lockfiles: the repo ignores `Cargo.lock` (see root `.gitignore`), so the
# cargo entries update direct dependencies without transitive visibility.
# Committing lockfiles for the worker crates would close that gap; that is
# a scaffold-wide decision for the owning card, not this security PR.
#
# First Dependabot PR: confirm the required checks (`ci-ok`, `gitleaks`,
# `pr-lint`, Paperclip Review) all appear on it before relying on them —
# automated authorship may not trigger every check. If the review check
# is missing, a maintainer mentions the reviewer on the PR.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Root workspace (covers crates/nntune-core; workers/* are excluded
  # standalone crates and get their own entries below).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Standalone worker crates (vault crypto: aes-gcm, hmac; base64).
  - package-ecosystem: "cargo"
    directory: "/workers/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/workers/ingest"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # MusicBrainz mirror worker (standalone crate, built by the rust-mb job).
  - package-ecosystem: "cargo"
    directory: "/workers/mb"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Batch import image (FROM postgres).
  - package-ecosystem: "docker"
    directory: "/containers/mb-import"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
