name: gitleaks

# Full-history secret scan; `gitleaks` is a required check on main. Uses the
# gitleaks binary directly (the gitleaks-action wrapper needs a paid licence
# for organizations), pinned by SHA-256. Keep the JOB name `gitleaks`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: `gitleaks` is a required check, so it
  # must report on merge_group. Queue runs take the merged-policy branch
  # below (event is not pull_request), which is the correct policy for the
  # temporary merge commit.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a queue validation run (see ci.yml).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret added then removed on the same branch is
          # still a leak, and a shallow clone hides it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, copied
          # from the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt.
          # Bump together with GITLEAKS_VERSION, never on its own.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the full history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          # On pull_request use the base branch's policy AND the base
          # branch's ignore file. Gitleaks reads <source>/.gitleaksignore
          # from the scanned checkout (the PR branch) IN ADDITION to
          # --gitleaks-ignore-path, so pinning the flag alone still lets a
          # PR-added ignore silence its own scan (reproduced with 8.30.1:
          # key commit + root-ignore commit exits 0 with the flag pinned
          # to an empty file). Both layers below come from the base ref:
          # the flag AND the working-tree file are forced to the base
          # policy. The history scan reads git objects, so replacing the
          # working copy hides nothing; a PR-added ignore takes effect
          # only after merge — and the merge itself required this scan to
          # pass first.
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="refs/remotes/origin/${{ github.base_ref }}"
            scratch="$(mktemp -d "$RUNNER_TEMP/gitleaks-base-policy.XXXXXX")"
            if git cat-file -e "${base}:.gitleaks.toml" 2>/dev/null; then
              git show "${base}:.gitleaks.toml" > "${scratch}/gitleaks.toml"
            else
              printf '[extend]\nuseDefault = true\n' > "${scratch}/gitleaks.toml"
            fi
            if git cat-file -e "${base}:.gitleaksignore" 2>/dev/null; then
              git show "${base}:.gitleaksignore" > "${scratch}/.gitleaksignore"
              git show "${base}:.gitleaksignore" > .gitleaksignore
            else
              : > "${scratch}/.gitleaksignore"
              rm -f .gitleaksignore
            fi
            if git diff --name-only "${base}...HEAD" -- .gitleaksignore | grep -q .; then
              echo "::warning::PR touches .gitleaksignore; it is NOT in effect for this scan (base ignore pinned). Review the ignore change itself before merge."
            fi
            "$GITLEAKS_BIN" git . --redact --verbose --exit-code 1 \
              --log-opts=HEAD --ignore-gitleaks-allow \
              --config "${scratch}/gitleaks.toml" \
              --gitleaks-ignore-path "${scratch}/.gitleaksignore"
          else
            "$GITLEAKS_BIN" git . --redact --verbose --exit-code 1 \
              --log-opts=HEAD --ignore-gitleaks-allow \
              --config .gitleaks.toml
          fi
