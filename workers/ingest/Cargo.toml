[package]
name = "nntune-ingest"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 ingest pipeline worker (Cloudflare Worker, Rust workers-rs): BYO indexer search, NZB upload, verify, MB match"
license = "MIT"

[lib]
# cdylib for the worker; rlib so tests/ integration targets can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.3", features = ["http", "queue"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
